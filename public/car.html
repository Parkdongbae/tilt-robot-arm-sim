<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기울기 핸들 레이싱</title>
<style>
  :root { --panel: rgba(12, 16, 26, .72); --line: rgba(255,255,255,.14); --text: #eef2f8; --muted: #9aa6b8; --accent: #4cc9f0; --warn: #ffb703; --bad: #ef476f; --good: #06d6a0; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f18; color: var(--text);
    font-family: "Segoe UI", "Malgun Gothic", system-ui, sans-serif; user-select: none; }
  canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 14px;
    backdrop-filter: blur(6px); padding: 12px 16px; }
  .num { font-variant-numeric: tabular-nums; }

  #race { top: 16px; left: 16px; min-width: 210px; }
  #race .lap { font-size: 26px; font-weight: 700; }
  #race .lap small { font-size: 14px; color: var(--muted); font-weight: 400; }
  #race .time { font-size: 30px; font-weight: 700; margin: 2px 0 6px; }
  #race table { width: 100%; font-size: 14px; border-collapse: collapse; color: var(--muted); }
  #race td:last-child { text-align: right; color: var(--text); }

  #mapBox { top: 16px; right: 16px; padding: 8px; }
  #map { display: block; width: 190px; height: 190px; }

  #dash { bottom: 18px; right: 18px; width: 330px; }
  #dash .top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
  #speed { font-size: 64px; font-weight: 800; line-height: .9; }
  #speed + small { color: var(--muted); font-size: 14px; }
  #gearBox { text-align: center; }
  #gear { font-size: 52px; font-weight: 800; line-height: .9; color: var(--accent); min-width: 70px; }
  #mode { display: inline-block; margin-top: 6px; font-size: 13px; padding: 2px 10px; border-radius: 99px;
    border: 1px solid var(--line); color: var(--muted); }
  #rpmBar { position: relative; height: 16px; margin-top: 12px; border-radius: 8px; overflow: hidden;
    background: linear-gradient(90deg, rgba(255,255,255,.1) 0 88%, rgba(239,71,111,.45) 88% 100%); }
  #rpmFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #06d6a0, #ffd166 70%, #ef476f); }
  #rpmText { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-top: 4px; }
  #shiftHint { color: var(--warn); font-weight: 700; visibility: hidden; }
  #shiftHint.on { visibility: visible; animation: blink .25s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .pedals { display: flex; gap: 8px; margin-top: 8px; font-size: 12px; color: var(--muted); align-items: center; }
  .pedals .bar { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.1); overflow: hidden; }
  .pedals .bar i { display: block; height: 100%; width: 0; }
  #pThr { background: var(--good); } #pBrk { background: var(--bad); }

  #connect { bottom: 18px; left: 18px; width: 250px; text-align: center; }
  #connect h3 { margin: 0 0 8px; font-size: 16px; }
  #qr { background: #fff; border-radius: 10px; padding: 8px; width: 170px; margin: 0 auto; }
  #qr svg { display: block; width: 100%; height: auto; }
  #connect .url { font-size: 12px; color: var(--muted); word-break: break-all; margin-top: 8px; }
  #connect.hidden { display: none; }
  #phoneState { bottom: 18px; left: 18px; font-size: 14px; display: none; }
  #phoneState.on { display: block; }
  #phoneState b { color: var(--good); }

  #keys { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 12.5px; color: var(--muted);
    padding: 7px 14px; white-space: nowrap; }
  #keys b { color: var(--text); }

  #center { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    pointer-events: none; text-align: center; }
  #big { font-size: 150px; font-weight: 900; text-shadow: 0 6px 30px rgba(0,0,0,.6); line-height: 1; }
  #sub { font-size: 24px; text-shadow: 0 2px 10px rgba(0,0,0,.7); margin-top: 10px; }
  #wrong { position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 34px; font-weight: 800;
    color: var(--bad); text-shadow: 0 2px 10px #000; display: none; animation: blink .5s steps(2) infinite; }
  #toast { position: fixed; top: 16px; left: 50%; transform: translateX(-50%); padding: 8px 18px; border-radius: 99px;
    background: var(--panel); border: 1px solid var(--line); opacity: 0; transition: opacity .2s; font-size: 16px; }
  #toast.show { opacity: 1; }

  #result { top: 50%; left: 50%; transform: translate(-50%, -50%); min-width: 360px; text-align: center; display: none; padding: 24px 30px; }
  #result h2 { margin: 0 0 6px; font-size: 30px; }
  #result .total { font-size: 44px; font-weight: 800; color: var(--accent); }
  #result table { width: 100%; margin: 12px 0; font-size: 17px; border-collapse: collapse; }
  #result td { padding: 4px 8px; } #result td:last-child { text-align: right; }
  #result .best td { color: var(--warn); font-weight: 700; }
  #result p { color: var(--muted); margin: 6px 0 0; }
  a.back { position: fixed; top: 220px; right: 16px; font-size: 12px; color: var(--muted); text-decoration: none; }
  a.back:hover { color: var(--text); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div class="panel" id="race">
  <div class="lap">LAP <span id="lap" class="num">1</span><small> / <span id="laps">3</span></small></div>
  <div class="time num" id="time">0:00.00</div>
  <table>
    <tr><td>이번 랩</td><td class="num" id="cur">-</td></tr>
    <tr><td>지난 랩</td><td class="num" id="last">-</td></tr>
    <tr><td>베스트 랩</td><td class="num" id="best">-</td></tr>
  </table>
</div>

<div class="panel" id="mapBox"><canvas id="map" width="380" height="380"></canvas></div>
<a class="back" href="/">← 게임 선택</a>

<div class="panel" id="dash">
  <div class="top">
    <div><div id="speed" class="num">0</div><small>km/h</small></div>
    <div id="gearBox"><div id="gear">1</div><span id="mode">자동 AT</span></div>
  </div>
  <div id="rpmBar"><div id="rpmFill"></div></div>
  <div id="rpmText"><span class="num" id="rpm">900 rpm</span><span id="shiftHint">▲ 변속!</span></div>
  <div class="pedals"><span>브레이크</span><div class="bar"><i id="pBrk"></i></div><div class="bar"><i id="pThr"></i></div><span>악셀</span></div>
</div>

<div class="panel" id="connect">
  <h3>📱 폰으로 QR을 찍어 핸들 연결</h3>
  <div id="qr"></div>
  <div class="url" id="url"></div>
</div>
<div class="panel" id="phoneState">📱 핸들 <b>연결됨</b></div>

<div class="panel" id="keys">
  키보드: <b>↑↓←→</b> 운전 · <b>E/Q</b> 기어 ▲▼ · <b>T</b> 자동/수동 · <b>C</b> 시점 · <b>R</b> 복귀 · <b>Enter</b> 시작/재시작 · <b>M</b> 소리
</div>

<div id="center"><div id="big"></div><div id="sub"></div></div>
<div id="wrong">⚠ 역주행!</div>
<div id="toast"></div>

<div class="panel" id="result">
  <h2>🏁 완주!</h2>
  <div class="total num" id="resTotal"></div>
  <table id="resLaps"></table>
  <p>다시 하려면 폰의 <b>재시작</b> 또는 <b>Enter</b></p>
</div>

<script type="importmap">
  { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
</script>
<script type="module" src="car.js"></script>
</body>
</html>
