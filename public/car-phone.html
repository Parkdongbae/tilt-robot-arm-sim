<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>핸들 조종기</title>
<style>
  :root { --bg: #0f1420; --card: #1a2233; --line: #2b3650; --text: #eef2f8; --muted: #93a0b5;
    --accent: #4cc9f0; --good: #06d6a0; --bad: #ef476f; --warn: #ffb703; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--text);
    font-family: system-ui, "Malgun Gothic", sans-serif; user-select: none; -webkit-user-select: none;
    touch-action: none; overscroll-behavior: none; }
  button { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 14px; touch-action: none; }
  button.active { filter: brightness(1.5); }

  #app { position: fixed; inset: 0; display: grid; grid-template-columns: minmax(120px, 24%) 1fr minmax(120px, 24%); gap: 8px;
    padding: max(8px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right)) max(8px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left)); }
  .side { display: grid; grid-template-rows: 30% 1fr; gap: 8px; min-height: 0; }
  .paddle { font-size: 26px; font-weight: 800; line-height: 1.1; }
  .paddle small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); }
  .pedal { font-size: 20px; font-weight: 800; border-width: 2px; }
  .pedal small { display: block; font-size: 12px; font-weight: 400; opacity: .8; }
  #brake { background: #3a1722; border-color: var(--bad); }
  #brake.active { background: var(--bad); filter: none; }
  #gas { background: #0f3229; border-color: var(--good); }
  #gas.active { background: var(--good); color: #012; filter: none; }

  .mid { display: flex; flex-direction: column; gap: 6px; min-width: 0; min-height: 0; }
  .bar { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #55607a; margin-right: 4px; }
  .dot.on { background: var(--good); }
  .seg { margin-left: auto; display: flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 7px 14px; font-size: 14px; background: transparent; color: var(--muted); }
  .seg button.on { background: var(--accent); color: #012; font-weight: 700; }

  .wheelWrap { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; }
  #wheel { height: 100%; max-height: 100%; aspect-ratio: 1; max-width: 100%; }
  .readout { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; pointer-events: none; }
  #kmh { font-size: 34px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
  .readout small { font-size: 11px; color: var(--muted); }
  #gear { position: absolute; right: 4px; top: 0; font-size: 34px; font-weight: 800; color: var(--accent); }
  #lap { position: absolute; left: 4px; top: 4px; font-size: 14px; color: var(--muted); }
  #hint { position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 12px; color: var(--warn); }
  #rpmBar { height: 10px; border-radius: 5px; overflow: hidden; position: relative;
    background: linear-gradient(90deg, #232d44 0 88%, #5b2333 88% 100%); }
  #rpmFill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #06d6a0, #ffd166 70%, #ef476f); }
  .tools { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .tools button { padding: 9px 2px; font-size: 13px; border-radius: 10px; white-space: nowrap; }

  .overlay { position: fixed; inset: 0; background: var(--bg); z-index: 10; display: flex; flex-direction: column;
    align-items: center; justify-content: safe center; gap: 8px; padding: 10px 16px; text-align: center; overflow: auto; }
  .overlay h1 { margin: 0; font-size: 20px; }
  .overlay p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.4; }
  .choice { display: flex; gap: 10px; }
  .choice button { padding: 9px 18px; min-width: 140px; font-size: 16px; font-weight: 700; }
  .choice button small { display: block; font-size: 12px; font-weight: 400; color: var(--muted); margin-top: 2px; }
  .choice button.on { border-color: var(--accent); background: #12344a; }
  #btnStart { padding: 11px 44px; font-size: 19px; font-weight: 800; background: var(--accent); color: #012; border: 0; }
  .err { color: var(--bad) !important; min-height: 1.2em; }

  #rotate { display: none; z-index: 5; font-size: 20px; }
  @media (orientation: portrait) { body.started #rotate { display: flex; } }

  #toast { position: fixed; left: 50%; top: 10px; transform: translateX(-50%); background: #000c; padding: 7px 16px;
    border-radius: 99px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 20; white-space: nowrap; }
  #toast.show { opacity: 1; }
</style>
</head>
<body>
<div id="app">
  <div class="side">
    <button class="paddle" id="btnDown">▼<small id="lblDown">R 후진</small></button>
    <button class="pedal" id="brake">브레이크<small>왼손 엄지</small></button>
  </div>

  <div class="mid">
    <div class="bar">
      <span><i class="dot" id="dServer"></i>서버</span>
      <span><i class="dot" id="dDisplay"></i>PC</span>
      <span><i class="dot" id="dSensor"></i>센서</span>
      <div class="seg"><button id="mAuto" class="on">자동</button><button id="mManual">수동</button></div>
    </div>
    <div class="wheelWrap" id="wheelWrap">
      <svg id="wheel" viewBox="-100 -100 200 200">
        <g id="wheelG">
          <circle r="88" fill="none" stroke="#3a4766" stroke-width="16"/>
          <path d="M-80 0 H-34 M34 0 H80 M0 34 V80" stroke="#3a4766" stroke-width="13" stroke-linecap="round"/>
          <circle r="34" fill="#1a2233" stroke="#3a4766" stroke-width="5"/>
          <rect x="-5" y="-96" width="10" height="16" rx="3" fill="#4cc9f0"/>
        </g>
      </svg>
      <div class="readout"><div id="kmh">0</div><small>km/h</small></div>
      <div id="gear">D1</div>
      <div id="lap">LAP 1/3</div>
      <div id="hint"></div>
    </div>
    <div id="rpmBar"><div id="rpmFill"></div></div>
    <div class="tools">
      <button id="btnCal">⊙ 영점</button>
      <button id="btnSens">감도 보통</button>
      <button id="btnCam">🎥 시점</button>
      <button id="btnReset">↩ 복귀</button>
      <button id="btnRestart">↺ 재시작</button>
    </div>
  </div>

  <div class="side">
    <button class="paddle" id="btnUp">▲<small id="lblUp">D 전진</small></button>
    <button class="pedal" id="gas">악셀<small>오른손 엄지</small></button>
  </div>
</div>

<div class="overlay" id="rotate">📱↻<p>폰을 <b>가로로</b> 돌려 핸들처럼 잡아 주세요<br>(화면 자동 회전을 켜 주세요)</p></div>

<div class="overlay" id="overlay">
  <h1>🏎 핸들 조종기</h1>
  <p>변속 방식을 고르세요 (주행 중에도 바꿀 수 있어요)</p>
  <div class="choice">
    <button id="cAuto" class="on">자동 (AT)<small>기어가 알아서 바뀜</small></button>
    <button id="cManual">수동 (MT)<small>▲▼ 로 직접 변속</small></button>
  </div>
  <p>폰을 <b>가로로</b> 세워 두 손으로 핸들처럼 잡고 시작하세요.<br>핸들처럼 좌우로 돌리면 방향이 바뀝니다.</p>
  <button id="btnStart">시작하기</button>
  <p id="startErr" class="err"></p>
</div>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const buzz = (p) => navigator.vibrate && navigator.vibrate(p);
function toast(t) {
  $('toast').textContent = t;
  $('toast').classList.add('show');
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $('toast').classList.remove('show'), 1600);
}

// ---------------- PC 연결 (로컬 서버면 WebSocket, Vercel 등에서는 P2P: car-link.js) ----------------
let link = null;
function send(obj) { if (link) link.send(obj); }
let pcOn = false, startSent = false;
import('./car-link.js').then(({ createPhoneLink }) => createPhoneLink({
  onStatus: ({ server, display }) => {
    $('dServer').classList.toggle('on', server);
    $('dDisplay').classList.toggle('on', display);
    const justConnected = display && !pcOn;
    pcOn = display;
    if (justConnected && started) {
      send({ type: 'carEvent', name: 'setMode', value: mode });   // 다시 연결되면 변속 방식 맞춤
      if (!startSent) { send({ type: 'carEvent', name: 'start' }); startSent = true; }
    }
  },
  onMessage: (m) => {
    if (m.type === 'feedback') {
      if (m.vibrate) buzz(m.vibrate);
      if (m.text) toast(m.text);
      if (m.car) showCar(m.car);
    }
  },
})).then((l) => {
  link = l;
  if (l.error) $('startErr').textContent = l.error;
}).catch(() => { $('startErr').textContent = '연결 기능을 불러오지 못했습니다. 인터넷 연결을 확인해 주세요.'; });

// ---------------- 상태 ----------------
let started = false;
let mode = 'auto';
let steer = 0, throttle = 0, brake = 0;
let lastGear = '';

function showMode(m) {
  mode = m;
  for (const [id, v] of [['mAuto', 'auto'], ['mManual', 'manual'], ['cAuto', 'auto'], ['cManual', 'manual']]) {
    $(id).classList.toggle('on', v === m);
  }
  $('lblUp').textContent = m === 'auto' ? 'D 전진' : '기어 올림';
  $('lblDown').textContent = m === 'auto' ? 'R 후진' : '기어 내림';
}
function chooseMode(m) {
  showMode(m);
  send({ type: 'carEvent', name: 'setMode', value: m });
  buzz(20);
}
$('mAuto').onclick = $('cAuto').onclick = () => chooseMode('auto');
$('mManual').onclick = $('cManual').onclick = () => chooseMode('manual');

function showCar(c) {
  $('kmh').textContent = c.kmh;
  $('gear').textContent = c.gear;
  $('lap').textContent = `LAP ${c.lap}/${c.laps}`;
  $('rpmFill').style.width = clamp(c.rpm, 0, 1) * 96 + '%';
  if (c.mode !== mode) showMode(c.mode);
  if (c.gear !== lastGear) { if (lastGear) buzz(15); lastGear = c.gear; }
}

// ---------------- 핸들(기울기 센서) ----------------
// 폰을 가로로 세워 잡았을 때, 화면에 수직인 축으로 돌린 각도를 중력 방향에서 구한다.
// 기기 좌표에서 "위쪽" 벡터 = (-cosβ·sinγ, sinβ, cosβ·cosγ)
const SENS = [['보통', 40], ['민감', 28], ['둔감', 58]];   // 끝까지 꺾이는 핸들 각도(도)
let sensIdx = 0;
let theta = null;        // 현재 핸들 각도 (도). 가로로 수평이면 0, 오른쪽으로 돌리면 +
let zero = null;         // 사용자가 맞춘 영점 (없으면 수평 가로 자세가 중립)
let sensorOk = false;
const RAD = Math.PI / 180;

// 가로로 잡았을 때 어느 쪽이 위인지 (+1: 폰 윗부분이 왼쪽, -1: 오른쪽). 폰을 눕혀도 마지막 값을 유지
let side = (screen.orientation && screen.orientation.angle === 270) || window.orientation === -90 ? -1 : 1;

function onOrient(e) {
  if (e.beta == null || e.gamma == null) return;
  sensorOk = true;
  $('dSensor').classList.add('on');
  const b = e.beta * RAD, g = e.gamma * RAD;
  const ux = -Math.cos(b) * Math.sin(g), uy = Math.sin(b);
  if (Math.abs(ux) > 0.3) side = Math.sign(ux);
  // 핸들 각도 = 폰의 긴 축이 수평에서 얼마나 기울었는지.
  // 세워 잡으면 화면을 돌린 각도와 같고, 눕혀 잡아도(좌우로 기울이기) 끊기지 않고 동작한다.
  // (예전에는 폰을 많이 눕히면 값이 멈춰 핸들이 그 자리에 고정되는 문제가 있었음)
  theta = Math.atan2(uy * side, Math.max(Math.abs(ux), 0.45)) / RAD;   // 오른쪽(시계 방향)으로 돌리면 +
  const d = theta - (zero != null ? zero : 0);
  const dead = 1.5, max = SENS[sensIdx][1];
  const a = Math.abs(d);
  setSteer(a < dead ? 0 : Math.sign(d) * Math.min(1, (a - dead) / (max - dead)), d);
}

function setSteer(v, deg) {
  steer = v;
  $('wheelG').setAttribute('transform', `rotate(${clamp(deg != null ? deg : v * 60, -100, 100)})`);
}

// 센서가 없는 기기(PC 테스트 등): 가운데 핸들을 좌우로 드래그
let drag = null;
$('wheelWrap').addEventListener('pointerdown', (e) => { if (!sensorOk) { drag = e.clientX; $('wheelWrap').setPointerCapture(e.pointerId); } });
$('wheelWrap').addEventListener('pointermove', (e) => { if (drag != null) setSteer(clamp((e.clientX - drag) / 90, -1, 1)); });
for (const ev of ['pointerup', 'pointercancel']) $('wheelWrap').addEventListener(ev, () => { if (drag != null) { drag = null; setSteer(0); } });

// ---------------- 페달 · 버튼 ----------------
// 누르고 있는 동안 동작 (여러 손가락 동시 터치)
function hold(el, onChange) {
  const ids = new Set();
  const upd = () => { el.classList.toggle('active', ids.size > 0); onChange(ids.size > 0); };
  el.addEventListener('pointerdown', (e) => { e.preventDefault(); ids.add(e.pointerId); try { el.setPointerCapture(e.pointerId); } catch {} upd(); });
  for (const ev of ['pointerup', 'pointercancel', 'lostpointercapture']) {
    el.addEventListener(ev, (e) => { ids.delete(e.pointerId); upd(); });
  }
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
hold($('gas'), (on) => { throttle = on ? 1 : 0; });
hold($('brake'), (on) => { brake = on ? 1 : 0; });

function tap(el, fn) {
  el.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    el.classList.add('active');
    setTimeout(() => el.classList.remove('active'), 120);
    fn();
  });
  el.addEventListener('contextmenu', (e) => e.preventDefault());
}
const event = (name) => { send({ type: 'carEvent', name }); buzz(20); };
tap($('btnUp'), () => event('shiftUp'));
tap($('btnDown'), () => event('shiftDown'));
tap($('btnCam'), () => event('camera'));
tap($('btnReset'), () => event('reset'));
tap($('btnRestart'), () => event('restart'));
tap($('btnCal'), () => {
  if (theta == null) return toast('센서 값이 아직 없어요');
  zero = theta;
  toast('지금 자세를 핸들 중립으로 맞췄어요');
  buzz(20);
});
tap($('btnSens'), () => {
  sensIdx = (sensIdx + 1) % SENS.length;
  $('btnSens').textContent = '감도 ' + SENS[sensIdx][0];
});

// 30Hz 로 PC에 전송
setInterval(() => {
  if (started) send({ type: 'car', steer: +steer.toFixed(3), throttle, brake });
}, 33);

// ---------------- 시작 ----------------
$('btnStart').onclick = async () => {
  let denied = false;
  try {
    // iOS 13+ 는 사용자 터치 후 권한 요청이 필요
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      denied = (await DeviceOrientationEvent.requestPermission()) !== 'granted';
    }
  } catch { denied = true; }
  window.addEventListener('deviceorientation', onOrient);
  // 전체 화면 + 가로 고정 (지원하는 기기만)
  // (기다리지 않음: 일부 브라우저는 응답이 늦거나 없어서 시작이 막힐 수 있음)
  (async () => {
    try {
      if (document.documentElement.requestFullscreen) await document.documentElement.requestFullscreen();
      if (screen.orientation && screen.orientation.lock) await screen.orientation.lock('landscape');
    } catch { /* 무시 */ }
  })();
  // 화면 꺼짐 방지
  if ('wakeLock' in navigator) {
    const keepAwake = () => navigator.wakeLock.request('screen').catch(() => {});
    keepAwake();
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') keepAwake(); });
  }

  started = true;
  document.body.classList.add('started');
  $('overlay').style.display = 'none';
  send({ type: 'carEvent', name: 'setMode', value: mode });
  if (pcOn) { send({ type: 'carEvent', name: 'start' }); startSent = true; }   // PC가 아직이면 연결되는 순간 보냄

  setTimeout(() => {
    if (!sensorOk) {
      $('hint').textContent = (denied ? '센서 권한이 거부됐어요' : '기울기 센서가 없어요') + ' — 핸들을 좌우로 드래그하세요';
      if (!window.isSecureContext) toast('센서는 https:// 주소에서만 동작해요');
      else if (denied) toast('브라우저 설정에서 동작/방향 센서를 허용해 주세요');
    }
  }, 1500);
};
</script>
</body>
</html>
