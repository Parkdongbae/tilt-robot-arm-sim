<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0f1420">
<title>왼쪽 조종기 · 로봇팔</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<header>
  <h1>🦾 로봇팔 조종</h1>
  <span class="role">왼쪽 폰</span>
</header>
<div class="status">
  <span><i class="dot" id="dServer"></i>서버</span>
  <span><i class="dot" id="dDisplay"></i>시뮬레이터</span>
  <span><i class="dot" id="dSensor"></i>센서</span>
</div>

<div class="card">
  <div class="tilt-vis"><div class="phone" id="phoneVis"></div></div>
  <div class="meter"><span>베이스 회전</span><div class="bar"><i class="center"></i><i class="fill" id="bYaw"></i></div><span class="val" id="vYaw">0</span></div>
  <div class="meter"><span>어깨</span><div class="bar"><i class="center"></i><i class="fill" id="bSh"></i></div><span class="val" id="vSh">0</span></div>
  <div class="meter"><span>팔꿈치</span><div class="bar"><i class="center"></i><i class="fill" id="bEl"></i></div><span class="val" id="vEl">0</span></div>
</div>

<div class="card">
  <p class="help">
    폰을 <b>화면이 위로 오게 눕혀서</b> 잡으세요.<br>
    · <b>좌우로 기울이기</b> → 베이스 회전<br>
    · <b>앞뒤로 기울이기</b> → 어깨 (앞으로 숙이면 팔이 앞으로)<br>
    · <b>아래 버튼을 누른 채</b> 앞뒤로 기울이기 → 팔꿈치<br>
    · 또는 <b>시계방향/반시계로 비틀기</b> → 팔꿈치 (켜져 있을 때)
  </p>
</div>

<div class="grow">
  <div class="row">
    <button id="btnTwist">비틀기 조작: 끔</button>
    <button id="btnSpeed">속도: 보통</button>
  </div>
  <button id="btnCal">⊙ 영점 맞추기 (지금 자세를 기준으로)</button>
  <button id="btnElbow" class="big">✋ 누르고 있으면 팔꿈치 모드</button>
</div>

<div class="overlay" id="overlay">
  <h1>🦾 왼쪽 폰 · 로봇팔 조종기</h1>
  <p>폰을 화면이 위로 오도록 편하게 눕혀 잡은 뒤<br>아래 버튼을 눌러 주세요.<br>누른 순간의 자세가 기준(영점)이 됩니다.</p>
  <button id="btnStart">시작하기</button>
  <p id="startErr" class="err"></p>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { createController, axis, angleDiff } from './controller.js';

const $ = (id) => document.getElementById(id);
const toast = (t) => { $('toast').textContent = t; $('toast').classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => $('toast').classList.remove('show'), 1600); };

const ctl = createController({
  role: 'left',
  onStatus: (s) => { $('dServer').classList.toggle('on', s.server); $('dDisplay').classList.toggle('on', s.display); },
  onFeedback: (m) => m.text && toast(m.text),
});

let zero = null;            // 영점 {alpha, beta, gamma}
let elbowHeld = false;
let twistOn = false;
const speeds = [['느림', 0.5], ['보통', 1], ['빠름', 1.6]];
let speedIdx = 1;
const out = { yaw: 0, shoulder: 0, elbow: 0 };

function calibrate() {
  zero = { alpha: ctl.raw.alpha, beta: ctl.raw.beta, gamma: ctl.raw.gamma };
  toast('영점을 맞췄어요');
}

function setBar(bar, val, v) {
  const w = Math.abs(v) * 50;
  bar.style.left = v >= 0 ? '50%' : (50 - w) + '%';
  bar.style.width = w + '%';
  val.textContent = (v * 100).toFixed(0);
}

ctl.onSensor((r) => {
  $('dSensor').classList.add('on');
  if (!zero) return;
  const db = r.beta - zero.beta;
  const dg = r.gamma - zero.gamma;
  const da = angleDiff(r.alpha, zero.alpha);

  out.yaw = axis(dg, 5, 32);              // 오른쪽으로 기울이면 + (오른쪽으로 회전)
  const pitch = -axis(db, 5, 32);         // 앞으로 숙이면 + (팔을 앞으로)
  if (elbowHeld) { out.shoulder = 0; out.elbow = pitch; }
  else {
    out.shoulder = pitch;
    out.elbow = twistOn ? -axis(da, 12, 45) : 0;  // 시계방향으로 비틀면 +
  }
  $('phoneVis').style.transform = `perspective(300px) rotateX(${-db}deg) rotateY(${dg}deg) rotateZ(${twistOn ? da : 0}deg)`;
});

// 30Hz 로 시뮬레이터에 전송
setInterval(() => {
  if (!zero) return;
  const s = speeds[speedIdx][1];
  ctl.send({ type: 'arm', yaw: out.yaw, shoulder: out.shoulder, elbow: out.elbow, speed: s });
  setBar($('bYaw'), $('vYaw'), out.yaw);
  setBar($('bSh'), $('vSh'), out.shoulder);
  setBar($('bEl'), $('vEl'), out.elbow);
}, 33);

// 버튼
const elbowBtn = $('btnElbow');
const holdOn = (e) => { e.preventDefault(); elbowHeld = true; elbowBtn.classList.add('active'); };
const holdOff = (e) => { e.preventDefault(); elbowHeld = false; elbowBtn.classList.remove('active'); };
elbowBtn.addEventListener('touchstart', holdOn, { passive: false });
elbowBtn.addEventListener('touchend', holdOff, { passive: false });
elbowBtn.addEventListener('touchcancel', holdOff, { passive: false });
elbowBtn.addEventListener('mousedown', holdOn);
window.addEventListener('mouseup', () => { if (elbowHeld) { elbowHeld = false; elbowBtn.classList.remove('active'); } });

$('btnCal').onclick = calibrate;
$('btnTwist').onclick = () => {
  twistOn = !twistOn;
  $('btnTwist').textContent = `비틀기 조작: ${twistOn ? '켬' : '끔'}`;
  $('btnTwist').classList.toggle('active', twistOn);
  calibrate();
};
$('btnSpeed').onclick = () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  $('btnSpeed').textContent = `속도: ${speeds[speedIdx][0]}`;
};

$('btnStart').onclick = async () => {
  $('startErr').textContent = '';
  try {
    await ctl.start();
    calibrate();
    $('overlay').style.display = 'none';
  } catch (e) {
    $('startErr').textContent = e.message;
  }
};
</script>
</body>
</html>
